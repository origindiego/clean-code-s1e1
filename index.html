<!DOCTYPE html>
<html lang-="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet">
    <link rel="stylesheet" href="style.css" media="screen" charset="UTF-8">
  </head>
  <body class="page">
    <main class="main">
      <h1 class="page-title">Todo App - Task Manager</h1>

      <section class="matrix-container" aria-label="Eisenhower matrix">
        <figure class="matrix-figure">
          <img 
            class="matrix-img" 
            src="./eisenhower-matrix.jpg" 
            alt="Eisenhower matrix chart showing task prioritization by urgency and importance"
          >
        </figure>
        <figcaption class="matrix-caption">
          Eisenhower Matrix — a visual method to prioritize tasks.
        </figcaption>
        <a 
          class="details-link"
          href="https://goal-life.com/page/method/matrix-eisenhower"
        >
            Want more details?
        </a>
      </section>
      <section class="todo-app" aria-label="Todo application">
        <form id="add-task-form" class="add-task-form" novalidate>
          <label class="new-task-label" for="new-task">Add Item</label>
          <div class="task-row">
            <input id="new-task" class="task-input" name="task" type="text">
            <button class="button button-add" type="submit">Add</button>
          </div>
        </form>

        <h3 class="section-title">Todo</h3>
        <ul id="incomplete-tasks" aria-live="polite">
          <li class="list-item">
            <input type="checkbox" class="task-checkbox">
            <label class="task-label">Pay Bills</label>
            <input type="text" class="task-input" aria-hidden="true">
            <button class="button button-edit" type="button">Edit</button>
            <button class="button button-delete" type="button" aria-label="Delete task">
              <img 
                src="./remove.svg" 
                class="delete-icon" 
                alt="Delete task icon"
              >
            </button>
          </li>
          <li class="list-item edit-mode">
            <input type="checkbox" class="task-checkbox">
            <label class="task-label">Go Shopping</label>
            <input type="text" value="Go Shopping" class="task-input" aria-hidden="true">
            <button class="button button-edit" type="button">Save</button>
            <button class="button button-delete" type="button" aria-label="Delete task">
              <img 
                src="./remove.svg" 
                class="delete-icon" 
                alt="Delete task icon"
              >
            </button>
          </li>
        </ul>

        <h3 class="section-title">Completed</h3>
        <ul id="completed-tasks" aria-live="polite">
          <li class="list-item">
            <input type="checkbox" checked class="task-checkbox">
            <label class="task-label">See the Doctor</label>
            <input type="text" class="task-input" aria-hidden="true">
            <button class="button button-edit" type="button">Edit</button>
            <button class="button button-delete" type="button" aria-label="Delete task">
              <img 
                src="./remove.svg" 
                class="delete-icon" 
                alt="Delete task icon"
              >
            </button>
          </li>
        </ul>
      </section>
    </main>
    
    <script src="app.js"></script>
  </body>
</html>
