<!DOCTYPE html>
<html>
  <head>
    <title>Todo App</title>
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet">
    <link rel="stylesheet" href="style.css" media="screen" charset="utf-8">
  </head>
  <body class="page">
    <div class="matrix-container">
      <img class="matrix-img" src="./eisenhower-matrix.jpg">
      <a 
        class="details-link"
        href="https://goal-life.com/page/method/matrix-eisenhower"
      >
          Want more details?
      </a>
    </div>
    <div class="todo-app">
      <p id="add-task">
        <label class="new-task-label" for="new-task">Add Item</label>
        <div class="task-row">
          <input id="new-task" class="task-input" type="text">
          <button class="button-add">Add</button>
        </div>
      </p>
      <h3 class="section-title">Todo</h3>
      <ul id="incomplete-tasks">
        <li class="list-item">
          <input type="checkbox" class="task-checkbox">
          <label class="task-label">Pay Bills</label>
          <input type="text" class="task-input">
          <button class="button-edit">Edit</button>
          <button class="button-delete">
            <img src="./remove.svg" class="delete-icon">
          </button>
        </li>
        <li class="list-item edit-mode">
          <input type="checkbox" class="task-checkbox">
          <label class="task-label">Go Shopping</label>
          <input type="text" value="Go Shopping" class="task-input">
          <button class="button-edit">Save</button>
          <button class="button-delete">
            <img src="./remove.svg" class="delete-icon">
          </button>
        </li>
      </ul>
      <h3 class="section-title">Completed</h3>
      <ul id="completed-tasks">
        <li class="list-item">
          <input type="checkbox" checked class="task-checkbox">
          <label class="task-label">See the Doctor</label>
          <input type="text" class="task-input">
          <button class="button-edit">Edit</button>
          <button class="button-delete">
            <img src="./remove.svg" class="delete-icon">
          </button>
        </li>
      </ul>
    </div>
    <script src="app.js"></script>
  </body>
</html>
