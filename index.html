<!DOCTYPE html>
<html lang-="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet">
    <link rel="stylesheet" href="style.css" media="screen" charset="UTF-8">
  </head>
  <body class="page">
    <main class="page__main">
      <h1 class="page__title">Todo App - Task Manager</h1>

      <section class="matrix" aria-label="Eisenhower matrix">
        <figure class="matrix__figure">
          <img 
            class="matrix__img" 
            src="./eisenhower-matrix.jpg" 
            alt="Eisenhower matrix chart showing task prioritization by urgency and importance"
          >
        </figure>
        <figcaption class="matrix__caption">
          Eisenhower Matrix — a visual method to prioritize tasks.
        </figcaption>
        <a 
          class="matrix__link"
          href="https://goal-life.com/page/method/matrix-eisenhower"
        >
            Want more details?
        </a>
      </section>
      <section class="todo" aria-label="Todo application">
        <form id="add-task-form" class="todo__form" novalidate>
          <label class="todo__label" for="new-task">Add Item</label>
          <div class="todo__row">
            <input 
              id="new-task" 
              class="task__input" 
              name="task" 
              type="text"
            >
            <button class="button button--add" type="submit">Add</button>
          </div>
        </form>

        <h3 class="todo__title">Todo</h3>
        <ul 
          id="incomplete-tasks" 
          class="todo__list todo__list--incomplete"
          aria-live="polite" 
        >
          <li class="task">
            <input type="checkbox" class="task__checkbox">
            <label class="task__label">Pay Bills</label>
            <input 
              type="text" 
              class="task__input" 
              aria-hidden="true"
            >
            <button class="button button--edit" type="button">Edit</button>
            <button 
              class="button button--delete" 
              type="button" 
              aria-label="Delete task"
            >
              <img 
                src="./remove.svg" 
                class="task__icon" 
                alt="Delete task icon"
              >
            </button>
          </li>
          <li class="task task--edit-mode">
            <input type="checkbox" class="task__checkbox">
            <label class="task__label">Go Shopping</label>
            <input 
              type="text" 
              value="Go Shopping" 
              class="task__input" 
              aria-hidden="true"
            >
            <button class="button button--edit" type="button">Save</button>
            <button 
              class="button button--delete" 
              type="button" 
              aria-label="Delete task"
            >
              <img 
                src="./remove.svg" 
                class="task__icon" 
                alt="Delete task icon"
              >
            </button>
          </li>
        </ul>

        <h3 class="todo__title">Completed</h3>
        <ul 
          id="completed-tasks" 
          class="todo__list todo__list--completed"
          aria-live="polite"
        >
          <li class="task">
            <input type="checkbox" checked class="task__checkbox">
            <label class="task__label">See the Doctor</label>
            <input type="text" class="task__input" aria-hidden="true">
            <button class="button button--edit" type="button">Edit</button>
            <button 
              class="button button--delete" 
              type="button" 
              aria-label="Delete task"
            >
              <img 
                src="./remove.svg" 
                class="task__icon" 
                alt="Delete task icon"
              >
            </button>
          </li>
        </ul>
      </section>
    </main>
    
    <script src="app.js"></script>
  </body>
</html>
